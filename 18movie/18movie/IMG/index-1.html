<p class="56"><img src="ad55ea38cf71ad15095c63c1394f1379.jpg" width="321" height="466" alt="1" /></p>
<p class="56">故事講述少女岩戶鈴芽、與以關閉災難之門為使命的「關門師」宗像草太，為了關閉災難之門展開一連串的冒險旅程。影片前導標語為「門的另一端，存在著所有的時間——」</p>
